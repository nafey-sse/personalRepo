<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIR Electoral Roll — AI System Architecture</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#020509;--panel:#070c17;--card:#0b1224;--card-hi:#0f1a35;--border:#15223e;--text:#adb8cc;--dim:#4e6080;--mute:#2c3d5c;--white:#e4eaf3;--cyan:#22d3ee;--amber:#f59e0b;--purple:#a78bfa;--emerald:#10b981;--pink:#ec4899;--orange:#f97316;--indigo:#6366f1;--red:#ef4444;--blue:#3b82f6;--saffron:#fb923c;--gandhi:#16a34a}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;min-height:100vh;line-height:1.5}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
.header{position:sticky;top:0;z-index:100;padding:14px 28px;background:linear-gradient(180deg,var(--panel) 60%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.header-brand{display:flex;align-items:center;gap:12px}
.header-logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--saffron),var(--blue),var(--gandhi));display:flex;align-items:center;justify-content:center;font-size:20px}
.header h1{font-size:18px;font-weight:900;color:var(--white);letter-spacing:-0.03em}
.header p{font-size:10px;color:var(--dim);margin-top:2px;font-family:'IBM Plex Mono',monospace}
.tabs{display:flex;gap:3px;background:var(--panel);border-radius:10px;padding:3px;border:1px solid var(--border)}
.tab-btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:700;font-family:'Outfit',sans-serif;background:transparent;color:var(--dim);transition:all .25s}
.tab-btn.active{background:var(--blue);color:#fff}.tab-btn:hover:not(.active){color:var(--white)}
.main-wrap{display:flex;min-height:calc(100vh - 72px)}
.main-content{flex:1;padding:22px 26px;overflow-y:auto}
.detail-panel{width:400px;border-left:1px solid var(--border);background:var(--panel);padding:24px;overflow-y:auto;position:sticky;top:72px;height:calc(100vh - 72px);display:none}
.detail-panel.open{display:block;animation:fadeUp .25s ease}
.tab-content{display:none}.tab-content.active{display:block}
.layer{margin-bottom:20px;animation:fadeUp .4s ease both}
.layer-header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:10px;margin-bottom:10px;transition:all .2s}
.nodes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:8px;padding-left:4px}
.node-card{padding:14px 15px;border-radius:11px;cursor:pointer;background:var(--card);border:1px solid var(--border);transition:all .25s;position:relative;overflow:hidden}
.node-card:hover{background:var(--card-hi);transform:translateY(-1px)}
.node-card.selected{transform:translateY(-2px)}
.node-card .top-line{position:absolute;top:0;left:0;right:0;height:2px;display:none}
.node-card.selected .top-line{display:block}
.node-head{display:flex;align-items:flex-start;gap:10px}
.node-icon{font-size:22px;line-height:1;flex-shrink:0}
.node-name{font-size:13px;font-weight:700;color:var(--white)}
.node-tech{font-size:10px;font-weight:600;margin-top:1px}
.node-desc{font-size:11px;color:var(--dim);margin-top:5px;line-height:1.4}
.detail-close{background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--dim);cursor:pointer;padding:5px 10px;font-size:13px}
.detail-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.detail-name{font-size:17px;font-weight:900;color:var(--white)}
.detail-layer{font-size:10px;font-weight:700;margin-top:2px}
.detail-badge{display:inline-block;padding:4px 10px;border-radius:6px;font-size:11px;font-weight:700;margin-bottom:16px}
.detail-text{font-size:12.5px;color:var(--text);line-height:1.8;white-space:pre-wrap;word-break:break-word;font-family:'IBM Plex Mono',monospace}
.conn-title{font-size:10px;font-weight:800;color:var(--mute);letter-spacing:.1em;margin:22px 0 10px}
.conn-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;margin-bottom:4px;cursor:pointer;transition:all .15s}
.conn-item:hover{filter:brightness(1.3)}
.pipeline-wrap{max-width:720px;margin:0 auto}
.phase-header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:10px;margin-bottom:14px}
.phase-label{font-size:12px;font-weight:800;letter-spacing:.08em;font-family:'IBM Plex Mono',monospace}
.step-row{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:11px;margin-bottom:5px;border:1px solid var(--border);background:var(--card);transition:all .4s;opacity:.2;transform:translateX(16px)}
.step-row.active{opacity:1;transform:translateX(0)}.step-row.current{box-shadow:0 0 16px color-mix(in srgb,currentColor 12%,transparent)}
.step-num{width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;border:2px solid currentColor}
.step-label{font-size:13px;font-weight:700;color:var(--white)}.step-desc{font-size:11px;color:var(--dim);margin-top:2px;line-height:1.4}
.step-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;animation:pulse 1s ease infinite;display:none}
.step-row.current .step-dot{display:block}
.step-conn{width:2px;height:8px;margin-left:30px;background:color-mix(in srgb,var(--border) 40%,transparent)}
.conn-group{margin-bottom:18px;border-radius:12px;overflow:hidden;background:var(--card);animation:fadeUp .3s ease both}
.conn-group-header{padding:12px 16px;display:flex;align-items:center;gap:8px}
.conn-flow-row{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;transition:background .15s}
.conn-flow-row:hover{filter:brightness(1.2)}
.conn-flow-name{font-size:11px;font-weight:600;color:var(--text);min-width:120px}
.conn-flow-line{flex:1;height:1px;position:relative}
.conn-flow-label{position:absolute;top:-9px;left:50%;transform:translateX(-50%);font-size:9px;white-space:nowrap;padding:0 6px;background:var(--card);font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:14px;padding:14px 16px;margin-top:10px;border-radius:10px;background:var(--card);border:1px solid var(--border)}
.feedback-box{text-align:center;padding:16px;border-radius:12px;margin-top:10px;font-size:12px;font-weight:600}
@media(max-width:900px){.detail-panel{display:none!important}.nodes-grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.nodes-grid{grid-template-columns:1fr}.header{padding:12px 16px}.main-content{padding:14px}}
</style>
</head>

</div>

<script>
const L=[{id:"access",name:"ACCESS LAYER",tag:"Illiterate-First, Voice-Driven, Works on ₹500 Phones",color:"var(--cyan)",icon:"👤",nodes:[{id:"voice",name:"Voice Search",tech:"Whisper + Bhashini API",icon:"🎙️",desc:"PRIMARY interface for illiterate users",detail:"THE MAIN INTERFACE — Not a secondary feature.\n\nINPUT: Speak name/relative's name in ANY Indian language.\n\nPIPELINE:\n┌───────────────────────────────────────────┐\n│  Audio Capture (Web Audio API)            │\n│  ↓                                        │\n│  Language Detection (12 Indian languages) │\n│  ↓                                        │\n│  STT via Bhashini API (Govt of India NLP) │\n│  Fallback: Whisper large-v3 (multilingual)│\n│  ↓                                        │\n│  Transliteration (IndicTrans2)            │\n│  \"Rajesh Kumar\" → राजेश कुमार / রাজেশ কুমার│\n│  ↓                                        │\n│  Phonetic Encoding (Soundex + Metaphone)  │\n│  ↓                                        │\n│  → AI Search Engine                       │\n└───────────────────────────────────────────┘\n\nWHY BHASHINI: Free, govt-backed, 22 scheduled languages, handles code-mixing, Indian accent trained."},{id:"pwa",name:"Mobile PWA",tech:"React + ServiceWorker + IndexedDB",icon:"📱",desc:"No app store, works on 2G, ~200KB",detail:"Progressive Web App — NO app store needed.\nWorks on 2G. ~200KB initial load.\n\nSTRUCTURED SEARCH FIELDS:\n• Voter Name (fuzzy match)\n• Father/Husband Name\n• Place / Constituency / Section\n• Date of Birth / Age (±3yr tolerance)\n• State dropdown\n• EPIC Number (exact match)\n• SIR Year (2002/2003/2005)\n• Gender filter\n\nICON-DRIVEN UI:\n🎙️ = Speak  📷 = Camera  🔍 = Search\n✅ = Found  ⚠️ = Check  ❌ = Not Found\n\nOFFLINE: IndexedDB cache for constituency data.\nBLO MODE: Bulk search 500 names → batch."},{id:"camera",name:"Camera OCR Input",tech:"TFLite On-Device",icon:"📷",desc:"Scan old voter ID → auto-search",detail:"For users who HAVE a document but CAN'T TYPE:\n\n1. Point camera at old voter ID / ration card\n2. On-device OCR extracts Name + Father + Address\n3. Auto-searches SIR database\n4. Shows matching records for visual confirmation\n\nALSO: Physical 2002 PDF printouts, BLO notes,\nold laminated EPIC cards (faded text).\n\nTECH: TensorFlow Lite on-device.\nFallback: Server OCR pipeline."},{id:"ussd",name:"USSD / SMS / IVR",tech:"Feature Phone Gateway",icon:"📞",desc:"300M+ Indians without smartphones",detail:"FOR 300M+ WITHOUT SMARTPHONES:\n\nUSSD (ANY phone, even ₹500):\n  Dial *123*VOTE# → Menu search\n  Select state → district → AC\n  Get SMS: \"Found Sr.142, Part 15\"\n\nSMS:\n  Send \"SIR RAJESH KUMAR LUCKNOW\" to 1950\n  Reply: matching serial/part/AC\n\nIVR (Voice Call):\n  Toll-free → Speak name → AI searches →\n  Reads back in your language\n\nServes 40% of target population."},{id:"web",name:"Web Portal",tech:"Next.js SSR",icon:"🌐",desc:"Desktop for officials, RTI, research",detail:"CITIZENS: Text search, advanced filters,\nPDF page download, shareable proof links.\n\nOFFICIALS: Dashboard — OCR progress,\naccuracy metrics, error correction, bulk export.\n\nRTI/RESEARCH: Aggregate stats,\ncross-year comparison, API access.\n\nTECH: Next.js SSR, CDN-cached."}]},{id:"ai",name:"AI BRAIN LAYER",tag:"Claude API — The Intelligence That Makes Everything Work",color:"var(--purple)",icon:"🧠",nodes:[{id:"query_ai",name:"Query Understanding",tech:"Claude Sonnet API",icon:"🧠",desc:"Natural language → structured search params",detail:"EVERY search passes through Claude API.\n\nINPUTS HANDLED:\n• \"Rajesh Kumar from Lucknow\"\n• \"मेरे दादा राम प्रसाद लखनऊ से\"\n• \"find grandfather Prasad ward 5\"\n• \"EPIC UP/04/403/152847\"\n• DOB: \"1957\" or \"age 45\" or \"born March 12\"\n\nClaude extracts:\n{name, father, place, dob, state, epic,\n search_type, transliterations[]}\n\nHandles 12+ Indian languages natively.\nHandles misspellings without training data.\nCost: ~$0.003 per query."},{id:"match_ai",name:"Smart Matching & Re-ranking",tech:"Claude + Fuzzy + Vector",icon:"🔗",desc:"Multi-strategy fusion, AI re-ranks",detail:"THREE PARALLEL STRATEGIES:\n\n1. EXACT LOOKUP\n   EPIC → PostgreSQL (<5ms)\n\n2. FUZZY NAME (Meilisearch)\n   Trigram + phonetic index\n   \"Rajesh Kumer\" → \"Rajesh Kumar\"\n   <50ms on 100M records\n\n3. SEMANTIC VECTOR (pgvector)\n   768-dim embeddings, ANN search\n   \"son of Ram Prasad, Mohalla 5\" matches\n   \"Ram Prasad Singh, H.No 5\"\n\nFUSION: Claude receives top candidates,\nre-ranks, resolves duplicates, disambiguates."},{id:"linkage_ai",name:"Legacy Linkage Engine",tech:"Claude Classification",icon:"⛓️",desc:"SELF / PROGENY / NONE classification",detail:"CORE SIR USE CASE:\n\"Prove name was in 2002 roll\"\n\nSELF ✅\nPerson directly in 2002 roll.\nname + father + age + area. 85%+\n\nPROGENY ⚠️\nParent in 2002, not person.\n\"Priya d/o Rajesh\" → finds Rajesh.\n\nNONE ❌\nNobody found.\nGenerates: next steps, docs needed,\nnearest ERO office.\n\nOUTPUT: linkage_type, matched_record,\nevidence_chain, confidence, certificate."},{id:"verify_ai",name:"OCR Verification",tech:"Claude Vision API",icon:"🔍",desc:"Cross-validate OCR, fallback for damaged pages",detail:"1. FALLBACK OCR\nPaddleOCR < 70% → send image to Claude Vision.\n~2% of pages. ~$500/state. Cached.\n\n2. QUALITY ASSURANCE\nRandom 1% sample validation.\nDiscrepancy > 5% → retrain PaddleOCR.\n\n3. DISAMBIGUATION\n10+ same-name matches → Claude checks\nsurrounding records, family groupings,\nsection context → grouped results."}]},{id:"mcp",name:"MCP INTEGRATION LAYER",tag:"Model Context Protocol — Automated Workflows Beyond Search",color:"var(--pink)",icon:"🔗",nodes:[{id:"gmail_mcp",name:"Gmail MCP",tech:"gmail.mcp.claude.com",icon:"📧",desc:"Email certificates & BLO notifications",detail:"WORKFLOW 1 — Certificate:\nFind record → Email Certificate →\nClaude drafts official SIR linkage cert →\nSends via Gmail → Citizen prints for BLO.\n\nWORKFLOW 2 — BLO Notification:\nNot found → help request to nearest BLO.\n\nWORKFLOW 3 — Bulk Reports:\nBooth complete → summary to ERO.\n\nMCP: https://gmail.mcp.claude.com/mcp"},{id:"gcal_mcp",name:"Google Calendar MCP",tech:"gcal.mcp.claude.com",icon:"📅",desc:"Schedule BLO visits & ERO hearings",detail:"WORKFLOW 1 — BLO Appointment:\nLow confidence → schedule verification.\nTitle, location, docs checklist.\n\nWORKFLOW 2 — ERO Hearing:\nNotice received → schedule with evidence.\n\nWORKFLOW 3 — Bulk BLO Schedule:\nOptimized door-to-door route by area.\n\nMCP: https://gcal.mcp.claude.com/mcp"},{id:"future_mcp",name:"Future MCP Servers",tech:"WhatsApp · Drive · Slack · Maps",icon:"🔮",desc:"Planned integrations",detail:"📱 WhatsApp Business MCP:\nResults + voice notes + PDF pages. 500M+ reach.\n\n📁 Google Drive MCP:\nBLO document storage by booth.\n\n💬 Slack MCP:\nElection commission coordination.\n\n🗺️ Google Maps MCP:\nBLO route optimization, booth verification."}]},{id:"ingest",name:"PDF INGESTION PIPELINE",tag:"One-Time Batch: Scanned Legacy PDFs → Searchable Database",color:"var(--amber)",icon:"⚙️",nodes:[{id:"pdf_classify",name:"PDF Classifier",tech:"PyMuPDF + Heuristics",icon:"📋",desc:"Detect PDF type, preprocess scanned pages",detail:"STEP 1: Classify incoming PDF.\n\n3 types:\nA) TEXT-BASED (post-2010) → direct extract\nB) SCANNED IMAGE (2002/2003) → OCR\nC) HYBRID → both\n\nPREPROCESSING:\n• Deskew, Binarize, Denoise\n• DPI upscale if <200\n• Split multi-column layouts"},{id:"layout_det",name:"Layout Detection",tech:"LayoutLMv3 + Table Transformer",icon:"📐",desc:"Detect table structure per state format",detail:"STEP 2: Document structure.\n\n┌────┬────────┬──────────┬────┬───────┐\n│ Sr │ Name   │ Father   │Age │ House │\n├────┼────────┼──────────┼────┼───────┤\n│ 1  │ राजेश   │ रामप्रसाद │ 45 │ 12/A  │\n└────┴────────┴──────────┴────┴───────┘\n\nFormat varies by STATE and YEAR.\nFine-tuned Table Transformer (DETR).\n10K+ annotated pages. Cell-level boxes."},{id:"ocr_engines",name:"Multi-Engine OCR",tech:"PaddleOCR + Tesseract + TrOCR",icon:"🔤",desc:"3-engine ensemble, per-cell confidence",detail:"STEP 3: Text extraction.\n\nPaddleOCR 2.7 — Primary\nDevanagari, Bengali, Tamil, Telugu.\n200K fine-tuned cell images. ~150ms/page.\n\nTesseract 5 — Secondary\nEnglish, numbers, EPIC codes.\n\nTrOCR — Handwritten fallback\nBLO corrections, marginal notes.\n\nCONSENSUS: Char-by-char vote.\nAll low → Claude Vision fallback."},{id:"ner_norm",name:"NER + Normalization",tech:"Custom NER + IndicTrans2",icon:"🏷️",desc:"Field classification, transliteration, phonetics",detail:"STEP 4: Classify & normalize.\n\nNER: PERSON | FATHER | AGE | HOUSE |\nEPIC | SERIAL | SECTION | GENDER\n\nNORMALIZATION:\n1. Expand: Kr.→Kumar, S/o→Son of\n2. Remove: Shri, Smt, Sri\n3. Transliterate all scripts (IndicTrans2)\n4. Phonetic: Soundex + Metaphone\n5. Store: original + normalized + variants"},{id:"index_store",name:"Triple Index",tech:"PostgreSQL + Meilisearch + pgvector",icon:"🗄️",desc:"Exact + Fuzzy + Semantic indexing",detail:"STEP 5: Index into 3 systems.\n\nEXACT (PostgreSQL): EPIC, Serial+Part. <5ms.\nFUZZY (Meilisearch): Trigram+phonetic. <50ms.\nSEMANTIC (pgvector): 768-dim. <100ms.\n\n~50K pages/state × 200 voters = ~10M/state.\n4-6 hrs on 4x A10G GPUs per state."}]},{id:"search",name:"SEARCH ENGINE",tag:"Multi-Strategy Fusion: Exact + Fuzzy + Semantic + AI Re-rank",color:"var(--emerald)",icon:"🔍",nodes:[{id:"query_proc",name:"Query Router",tech:"Strategy Selection",icon:"⚡",desc:"Route to optimal search strategy",detail:"ROUTING:\n\nEPIC number → EXACT (Postgres, <5ms)\nPrecise name+place → FUZZY + EXACT parallel\nNatural language → CLAUDE first → all 3\nArea-based → FILTERED SCAN (section index)\nFamily (\"grandfather\") → CLAUDE → father_name\n\nAll fused → Claude re-ranks + linkage."},{id:"name_match",name:"Indian Name Matcher",tech:"Custom Fuzzy Engine",icon:"🔗",desc:"Cross-script, phonetic, Jaro-Winkler",detail:"HARDEST PROBLEM:\n\n1. Multi-script: राजेश / Rajesh / রাজেশ\n2. Name order varies\n3. 100K+ same names in one state\n4. Abbreviations: Md.=Mohammad\n5. Adivasi: No surnames\n\nSCORING:\nName (Jaro-Winkler): 0.30\nFather match:         0.25\nAddress overlap:      0.20\nPhonetic match:       0.15\nAge proximity (±3yr): 0.10"},{id:"result_out",name:"Result Presentation",tech:"Multi-Modal Output",icon:"📊",desc:"Color cards + Voice + PDF + Certificate",detail:"FOR ILLITERATE USERS:\n\n✅ Green = Found in 2002\n⚠️ Yellow = Possible, verify\n❌ Red = Not found + next steps\n\nVOICE: Auto-reads results aloud.\n\n12 FIELDS PER RESULT:\nName, Father, DOB/Age, House, Section,\nAC, EPIC, Serial/Part, Year, Gender,\nState, OCR Confidence.\n\nACTIONS:\n📧 Email cert (Gmail MCP)\n📅 Schedule BLO (Calendar MCP)\n📄 View PDF page with highlight"}]},{id:"data",name:"DATA LAYER",tag:"Triple-Store Architecture for 900M+ Voter Records",color:"var(--orange)",icon:"🗄️",nodes:[{id:"postgres",name:"PostgreSQL + pgvector",tech:"Primary Store + Vectors",icon:"🐘",desc:"Structured records + 768-dim embeddings",detail:"SCHEMA:\nvoter_records: id, roll_id, serial_no,\n  name_original, name_normalized,\n  name_english, phonetic_codes[],\n  father_name, age, dob, gender,\n  house_no, section, epic_no,\n  ocr_confidence, embedding vector(768)\n\nlegacy_linkages:\n  voter_2026_id → voter_2002_id,\n  linkage_type, confidence, evidence\n\n~900M records. Citus sharding by state."},{id:"meili",name:"Meilisearch",tech:"Full-Text Fuzzy Search",icon:"🔎",desc:"Sub-50ms typo-tolerant name search",detail:"Built-in typo tolerance.\nCustom Indian name tokenizer.\n<50ms on 100M records.\n\n\"S/o Rajesh Kr. Singh\"\n→ [\"son of\",\"rajesh\",\"kumar\",\"singh\"]"},{id:"s3",name:"Object Storage",tech:"MinIO / S3 Mumbai",icon:"📦",desc:"PDFs, page images, model weights",detail:"1. Original PDFs (~2TB/state)\n2. Page images (300 DPI, ~200KB each)\n3. Cell crops (training data)\n4. Model weights\n\nCDN for page images.\nTotal: ~60TB across all states."},{id:"redis",name:"Redis + BullMQ",tech:"Cache + Task Queue",icon:"⚡",desc:"Hot cache, job queue, rate limiting",detail:"CACHE: 100K queries (40% hit rate)\nQUEUE: PDF ingestion, bulk search,\n  cert generation, nightly QA\nRATE LIMIT: 100/day per device\nPUB/SUB: Progress, analytics, alerts"}]},{id:"infra",name:"INFRASTRUCTURE",tag:"Indian Cloud, Election-Grade Security, Auto-Scale for 970M Citizens",color:"var(--indigo)",icon:"🏗️",nodes:[{id:"deploy",name:"Deployment",tech:"K8s AWS Mumbai / NIC",icon:"☸️",desc:"Data sovereignty, GPU auto-scale",detail:"DATA STAYS IN INDIA.\n\nK8s: CPU pool + GPU pool (T4/A10G)\nNormal: 4 GPU nodes\nElection day: auto-scale to 50\n\nCOST:\nBase: ₹3-5L/month\nPeak: ₹15-20L/month\nOCR: ₹10-15L per state (one-time)"},{id:"security",name:"Security & Compliance",tech:"IT Act Compliant",icon:"🛡️",desc:"TLS 1.3, AES-256, OTP, device attestation",detail:"• TLS 1.3 + AES-256 at rest\n• No PII in logs\n• OTP auth (like ECI portal)\n• Device attestation for BLO\n• DDoS protection\n• IT Act 2000 compliance\n• No Aadhaar linkage\n• 100 searches/day limit\n• CAPTCHA on web"},{id:"mlops",name:"MLOps & Feedback",tech:"Active Learning Loop",icon:"🔄",desc:"BLO corrections → weekly model retraining",detail:"BLO corrects OCR → new training pair.\n\n1. Low confidence → human review\n2. Corrections → fine-tune PaddleOCR\n3. A/B test new vs current\n4. Promote if accuracy up\n\nTARGET: 97%+ char accuracy (from 92%)\nDashboard: per-state, per-language CER."},{id:"scale",name:"Scale Numbers",tech:"National Stats",icon:"📈",desc:"970M voters, 60TB, 50M searches/day peak",detail:"• 28 states + 8 UTs\n• 4,120+ assembly constituencies\n• ~970M registered voters\n• SIR in 12 states/UTs\n\nPDFs: ~50K pages/state × 200 voters\n= ~200M+ records total\nStorage: ~60TB\n\nTraffic:\n  Normal: 100K/day\n  SIR: 10M/day\n  Election: 50M/day\n\n50M pages × 150ms = 87 GPU-days\n50 GPUs → 2 days/state"}]}];

const F=[{from:"voice",to:"query_ai",label:"Transcribed text",type:"primary"},{from:"pwa",to:"query_ai",label:"Structured fields (Name/DOB/Place...)",type:"primary"},{from:"camera",to:"query_ai",label:"OCR'd text from scanned doc",type:"primary"},{from:"ussd",to:"query_proc",label:"SMS/USSD query",type:"primary"},{from:"web",to:"query_ai",label:"Search params",type:"primary"},{from:"query_ai",to:"query_proc",label:"Structured params + strategy",type:"ai"},{from:"match_ai",to:"name_match",label:"Re-rank candidates",type:"ai"},{from:"linkage_ai",to:"result_out",label:"Linkage classification",type:"ai"},{from:"verify_ai",to:"ocr_engines",label:"Corrections → retrain",type:"feedback"},{from:"query_proc",to:"postgres",label:"Exact lookup (EPIC/Serial)",type:"data"},{from:"query_proc",to:"meili",label:"Fuzzy name search",type:"data"},{from:"name_match",to:"postgres",label:"Vector ANN search",type:"data"},{from:"linkage_ai",to:"gmail_mcp",label:"Send certificate email",type:"mcp"},{from:"linkage_ai",to:"gcal_mcp",label:"Schedule BLO visit",type:"mcp"},{from:"pdf_classify",to:"layout_det",label:"Preprocessed pages",type:"ingest"},{from:"layout_det",to:"ocr_engines",label:"Cell bounding boxes",type:"ingest"},{from:"ocr_engines",to:"ner_norm",label:"Raw OCR + confidence",type:"ingest"},{from:"ner_norm",to:"index_store",label:"Normalized records",type:"ingest"},{from:"index_store",to:"postgres",label:"Write records",type:"data"},{from:"index_store",to:"meili",label:"Write fuzzy index",type:"data"},{from:"index_store",to:"s3",label:"Store images + PDFs",type:"data"}];

const P=[{phase:"ONE-TIME PDF INGESTION",color:"var(--amber)",icon:"📄",steps:[{n:"1",label:"Upload SIR PDFs",desc:"Admin uploads 2002/2003/2005 electoral roll PDFs per state → district → AC → part",icon:"📤"},{n:"2",label:"Classify & Preprocess",desc:"Detect text/scanned/hybrid. Deskew, binarize, denoise. Split multi-column.",icon:"🔬"},{n:"3",label:"Layout Detection",desc:"LayoutLMv3 finds table structure, headers, columns per state format.",icon:"📐"},{n:"4",label:"Multi-Engine OCR",desc:"PaddleOCR + Tesseract + TrOCR ensemble. Per-cell extraction + confidence.",icon:"🔤"},{n:"5",label:"NER + Normalize",desc:"Classify fields. Expand abbreviations. Transliterate. Phonetic codes.",icon:"🏷️"},{n:"6",label:"Triple Index",desc:"PostgreSQL (exact) + Meilisearch (fuzzy) + pgvector (semantic). Link to PDF.",icon:"🗄️"}]},{phase:"LIVE SEARCH (AI-POWERED)",color:"var(--emerald)",icon:"🔍",steps:[{n:"7",label:"User Input",desc:"Name / Father / Place / DOB / State / EPIC fields — or voice — or camera — or SMS",icon:"🎙️"},{n:"8",label:"Claude Query Understanding",desc:"AI parses intent, handles misspellings, transliterates, selects search strategy.",icon:"🧠"},{n:"9",label:"Multi-Strategy Search",desc:"Parallel: exact (Postgres) + fuzzy (Meilisearch) + semantic (pgvector). Fuse & rank.",icon:"⚡"},{n:"10",label:"AI Re-ranking + Linkage",desc:"Claude re-ranks, classifies SELF / PROGENY / NONE, generates evidence chain.",icon:"⛓️"},{n:"11",label:"Present + Act",desc:"Voice readback + color cards + 12 fields + PDF page view + Certificate generation.",icon:"✅"}]},{phase:"MCP WORKFLOW ACTIONS",color:"var(--pink)",icon:"🔗",steps:[{n:"12",label:"Gmail: Certificate",desc:"Claude drafts SIR linkage certificate → sends via Gmail MCP to citizen's email.",icon:"📧"},{n:"13",label:"Calendar: BLO Visit",desc:"Auto-schedule verification appointment with documents checklist.",icon:"📅"},{n:"14",label:"Feedback → MLOps",desc:"Every BLO correction feeds OCR retraining. Search failures improve AI prompts.",icon:"🔄"}]}];

const FG=[{type:"primary",label:"User → AI Flows",color:"var(--cyan)",desc:"How user queries reach the AI brain"},{type:"ai",label:"AI Processing",color:"var(--purple)",desc:"Claude orchestrating search and matching"},{type:"data",label:"Data I/O",color:"var(--orange)",desc:"Read/write to storage layers"},{type:"mcp",label:"MCP Actions",color:"var(--pink)",desc:"Gmail certificates, Calendar scheduling"},{type:"ingest",label:"Ingestion Pipeline",color:"var(--amber)",desc:"PDF → OCR → Index (one-time)"},{type:"feedback",label:"Feedback Loops",color:"var(--emerald)",desc:"Corrections → retraining"}];

function fN(id){for(const l of L){const n=l.nodes.find(x=>x.id===id);if(n)return{...n,lc:l.color,ln:l.name,li:l.icon}}return null}
function gF(id){return F.filter(f=>f.from===id||f.to===id)}

let sel=null;

function renderLayers(){const el=document.getElementById('tab-layers');let h='';
L.forEach((l,li)=>{h+=`<div class="layer" style="animation-delay:${li*.06}s"><div class="layer-header" style="background:color-mix(in srgb,${l.color} 6%,transparent);border-left:4px solid ${l.color}"><span style="font-size:20px">${l.icon}</span><div><div style="display:flex;align-items:center;gap:8px"><span class="layer-tag" style="color:${l.color}">${l.name}</span><span style="font-size:9px;padding:2px 6px;border-radius:4px;font-weight:700;background:color-mix(in srgb,${l.color} 12%,transparent);color:${l.color}">${l.nodes.length}</span></div><div class="layer-sub">${l.tag}</div></div></div><div class="nodes-grid">`;
l.nodes.forEach(n=>{h+=`<div class="node-card" data-node="${n.id}" onclick="selNode('${n.id}')"><div class="top-line" style="background:linear-gradient(90deg,transparent,${l.color},transparent)"></div><div class="node-head"><span class="node-icon">${n.icon}</span><div><div class="node-name">${n.name}</div><div class="node-tech" style="color:${l.color}">${n.tech}</div></div></div><div class="node-desc">${n.desc}</div></div>`});
h+=`</div></div>`});
h+=`<div class="legend"><span style="font-size:10px;color:var(--mute);font-weight:700">LAYERS:</span>`;
L.forEach(l=>{h+=`<div style="display:flex;align-items:center;gap:5px"><div style="width:10px;height:10px;border-radius:3px;background:${l.color}"></div><span style="font-size:10px;color:var(--dim)">${l.name}</span></div>`});
h+=`<span style="font-size:10px;color:var(--mute);margin-left:auto">Click any component for deep details →</span></div>`;
el.innerHTML=h}

function renderFlow(){const el=document.getElementById('tab-flow');let h='<div class="pipeline-wrap">';let gi=0;
P.forEach(p=>{h+=`<div style="margin-bottom:28px"><div class="phase-header" style="background:color-mix(in srgb,${p.color} 6%,transparent);border-left:4px solid ${p.color}"><span style="font-size:20px">${p.icon}</span><span class="phase-label" style="color:${p.color}">${p.phase}</span></div>`;
p.steps.forEach((s,si)=>{const idx=gi++;h+=`<div class="step-row" data-step="${idx}" style="color:${p.color}"><div class="step-num">${s.n}</div><span style="font-size:18px">${s.icon}</span><div style="flex:1"><div class="step-label">${s.label}</div><div class="step-desc">${s.desc}</div></div><div class="step-dot" style="background:${p.color}"></div></div>`;
if(si<p.steps.length-1)h+=`<div class="step-conn"></div>`});h+=`</div>`});
h+=`<div class="feedback-box" style="color:var(--emerald);border:1px dashed color-mix(in srgb,var(--emerald) 30%,transparent);background:color-mix(in srgb,var(--emerald) 4%,transparent)">🔄 Every human correction feeds back → OCR models retrain weekly → accuracy improves continuously</div></div>`;
el.innerHTML=h}

function animFlow(){const rows=document.querySelectorAll('#tab-flow .step-row');let i=0;
const iv=setInterval(()=>{if(i<rows.length){rows[i].classList.add('active');if(i>0)rows[i-1].classList.remove('current');rows[i].classList.add('current')}i++;if(i>rows.length)clearInterval(iv)},380)}

function renderConns(){const el=document.getElementById('tab-connections');let h='<div style="max-width:800px;margin:0 auto"><p style="font-size:12px;color:var(--dim);margin-bottom:20px;text-align:center">All data flows between components. Click any row to jump to that node\'s details.</p>';
FG.forEach((g,gi)=>{const fl=F.filter(f=>f.type===g.type);if(!fl.length)return;
h+=`<div class="conn-group" style="border:1px solid color-mix(in srgb,${g.color} 15%,transparent);animation-delay:${gi*.08}s"><div class="conn-group-header" style="background:color-mix(in srgb,${g.color} 6%,transparent);border-bottom:1px solid color-mix(in srgb,${g.color} 12%,transparent)"><div style="width:14px;height:3px;border-radius:2px;background:${g.color}"></div><span style="font-size:12px;font-weight:800;color:${g.color};font-family:'IBM Plex Mono',monospace">${g.label}</span><span style="font-size:10px;color:var(--dim)">— ${g.desc}</span></div>`;
fl.forEach((f,fi)=>{const fr=fN(f.from),to=fN(f.to);if(!fr||!to)return;
h+=`<div class="conn-flow-row" onclick="goNode('${f.from}')" style="border-bottom:${fi<fl.length-1?'1px solid var(--border)':'none'}"><span style="font-size:15px">${fr.icon}</span><span class="conn-flow-name">${fr.name}</span><div class="conn-flow-line" style="background:linear-gradient(90deg,color-mix(in srgb,${g.color} 40%,transparent),color-mix(in srgb,${g.color} 15%,transparent))"><span class="conn-flow-label" style="color:${g.color}">${f.label}</span></div><span class="conn-flow-name" style="text-align:right">${to.name}</span><span style="font-size:15px">${to.icon}</span></div>`});
h+=`</div>`});h+=`</div>`;el.innerHTML=h}

function selNode(id){document.querySelectorAll('.node-card.selected').forEach(e=>{e.classList.remove('selected');e.style.borderColor='';e.style.boxShadow=''});
if(sel===id){sel=null;document.getElementById('detailPanel').classList.remove('open');return}
sel=id;const n=fN(id);if(!n)return;
const c=document.querySelector(`[data-node="${id}"]`);if(c){c.classList.add('selected');c.style.borderColor=n.lc;c.style.boxShadow=`0 0 24px color-mix(in srgb,${n.lc} 12%,transparent)`}
const dp=document.getElementById('detailPanel');
const tc={primary:"var(--cyan)",ai:"var(--purple)",data:"var(--orange)",mcp:"var(--pink)",ingest:"var(--amber)",feedback:"var(--emerald)"};
let h=`<div class="detail-header"><div style="display:flex;align-items:center;gap:10px"><span style="font-size:32px">${n.icon}</span><div><div class="detail-name">${n.name}</div><div class="detail-layer" style="color:${n.lc}">${n.li} ${n.ln}</div></div></div><button class="detail-close" onclick="selNode('${id}')">✕</button></div>`;
h+=`<div class="detail-badge" style="background:color-mix(in srgb,${n.lc} 10%,transparent);color:${n.lc}">${n.tech}</div>`;
h+=`<div class="detail-text">${n.detail}</div>`;
const fl=gF(id);if(fl.length){h+=`<div class="conn-title">CONNECTIONS (${fl.length})</div>`;
fl.forEach(f=>{const out=f.from===id,oid=out?f.to:f.from,o=fN(oid);if(!o)return;const cc=tc[f.type]||'var(--dim)';
h+=`<div class="conn-item" onclick="selNode('${oid}')" style="background:color-mix(in srgb,${cc} 6%,transparent);border:1px solid color-mix(in srgb,${cc} 15%,transparent)"><span style="font-size:15px">${o.icon}</span><div style="flex:1"><div style="font-size:11px;font-weight:700;color:var(--white)">${out?'→':'←'} ${o.name}</div><div style="font-size:9px;font-weight:500;color:${cc}">${f.label}</div></div></div>`})}
dp.innerHTML=h;dp.classList.add('open')}

function goNode(id){switchTab('layers');setTimeout(()=>selNode(id),100)}

let curTab='layers';
function switchTab(t){curTab=t;
document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
document.querySelectorAll('.tab-content').forEach(c=>c.classList.toggle('active',c.id==='tab-'+t));
sel=null;document.getElementById('detailPanel').classList.remove('open');
document.querySelectorAll('.node-card.selected').forEach(e=>{e.classList.remove('selected');e.style.borderColor='';e.style.boxShadow=''});
if(t==='flow'){document.querySelectorAll('#tab-flow .step-row').forEach(r=>r.classList.remove('active','current'));setTimeout(animFlow,300)}}

document.getElementById('tabBar').addEventListener('click',e=>{const b=e.target.closest('.tab-btn');if(b)switchTab(b.dataset.tab)});

renderLayers();renderFlow();renderConns();
</script>
</body>
</html>
